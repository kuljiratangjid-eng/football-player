<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Football</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
    video { width:100%; height:100vh; }
    .loading { position:absolute; top:50%; left:50%; color:white; font-family:sans-serif; transform:translate(-50%,-50%); z-index:10; }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <div class="loading" id="loading">กำลังโหลดสตรีม...</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let streamUrl = urlParams.get('url');

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');

    if (Hls.isSupported() && streamUrl) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        xhrSetup: function(xhr, url) {
          xhr.withCredentials = true;
          // ถ้ามี referer สามารถเพิ่มได้
        }
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loading.style.display = 'none';
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error(data);
        if (data.fatal) loading.innerHTML = '❌ โหลดไม่ได้ (ลิงก์หมดอายุ)';
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.onloadedmetadata = () => loading.style.display = 'none';
    }
  </script>
</body>
</html>
